name: CI
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 scripts/check_release_tree.py
      - run: python3 scripts/compile_all.py
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m unittest discover -s plugins/my-journal/tests -v
      - run: python3 -m unittest discover -s skills/note-taking/my-journal/tests -v
