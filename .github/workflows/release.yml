name: Release verification
on:
  workflow_dispatch:
    inputs:
      ref:
        required: true
        default: v0.1.0
        type: choice
        options:
          - v0.1.0
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - name: Validate exact release ref
        env:
          RELEASE_REF: ${{ inputs.ref }}
        run: test "$RELEASE_REF" = "v0.1.0"
      - run: python3 scripts/check_release_tree.py --root .
      - run: python3 scripts/compile_all.py
      - run: python3 -m unittest discover -s plugins/my-journal/tests
      - run: python3 -m unittest discover -s skills/note-taking/my-journal/tests
      - run: python3 -m unittest discover -s tests
      - run: python3 scripts/build_release.py --ref "${{ inputs.ref }}" --output dist
      - run: python3 scripts/verify_release.py --ref "${{ inputs.ref }}" --archive dist/my-journal-v0.1.0.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: my-journal-v0.1.0
          path: dist/*
