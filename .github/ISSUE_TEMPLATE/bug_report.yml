name: Bug report
description: Report a reproducible My Journal defect
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve My Journal. Remove all credentials, personal information, chat identifiers, and private conversation text before submitting.
  - type: input
    id: journal_version
    attributes:
      label: My Journal version
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: hermes_version
    attributes:
      label: Hermes Agent version
    validations:
      required: true
  - type: dropdown
    id: operating_system
    attributes:
      label: Operating system
      options: [Linux, macOS, Native Windows with Ubuntu WSL helper, Ubuntu under WSL, Other]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use synthetic or privacy safe examples only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: safe_logs
    attributes:
      label: Privacy safe logs
      description: Optional. Remove credentials, personal information, absolute private paths, and conversation content.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed secrets, tokens, passwords, personal information, chat identifiers, and private conversation content.
          required: true
