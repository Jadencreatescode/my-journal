name: Compatibility report
description: Report a successful or unsuccessful platform combination
title: "[Compatibility]: "
labels: ["compatibility"]
body:
  - type: input
    id: journal_version
    attributes:
      label: My Journal version
    validations:
      required: true
  - type: input
    id: hermes_version
    attributes:
      label: Hermes Agent version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system, version, architecture, and filesystem
    validations:
      required: true
  - type: textarea
    id: route
    attributes:
      label: Route exercised
      description: Install, setup, synthetic demo, backfill, scheduling, upgrade, restore, or uninstall.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Privacy safe evidence
      description: Include test counts or exact public commands, never private conversation content.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed secrets, tokens, passwords, personal information, chat identifiers, and private conversation content.
          required: true
