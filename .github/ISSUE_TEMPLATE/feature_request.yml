name: Feature request
description: Propose a focused improvement to My Journal
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and consent impact
      description: Explain whether this changes collection scope, provider exposure, retention, deletion, or credential handling.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: safe
    attributes:
      label: Submission confirmation
      options:
        - label: This request contains no credentials or private conversation content.
          required: true
